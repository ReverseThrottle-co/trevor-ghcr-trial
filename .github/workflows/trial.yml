name: GHCR trial
# Throwaway: builds the Trevor Bot image and pushes it to GHCR using only
# GITHUB_TOKEN, to test whether a Docker Hub-style secret is actually needed.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push, and report digest
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --push -t ghcr.io/reversethrottle-co/trevor-bot-trial:test \
            --metadata-file metadata.json .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ghcr.io/reversethrottle-co/trevor-bot-trial@${digest}" >> "${GITHUB_STEP_SUMMARY}"
